<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sendFood(){0
            let value = document.getElementById("foodInput").value;

            //js가 flask 서버에 요청
            fetch("/food?name="+value) // food주소로 url에 데이터 붙여 요청
                .then(response => response.text()) //응답을 문자열로 읽음
                .then(data => {
                    document.getElementById("result").innerText = data;
                })
        }
    </script>
</head>
<body>
    <input type="text" id="foodInput">
    <button onclick="sendFood()">조회</button>
    <p id="result"></p>
</body>
</html>
